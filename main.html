<body>
	 <script>
		 function minCost(arr) {
    let cost = 0;

    while (arr.length > 1) {
        arr.sort((a, b) => a - b);

        let first = arr.shift();
        let second = arr.shift();

        let sum = first + second;

        cost += sum;

        arr.push(sum);
    }

    return cost;
}

module.exports = minCost
    

    <script type="text/javascript" src="./script.js">
</script>

</body>
