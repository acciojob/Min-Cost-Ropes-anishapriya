<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	 <script>
        function minCost(arr) {
            let cost = 0;

            while (arr.length > 1) {

                // Sort the array
                arr.sort((a, b) => a - b);

                // Take the two smallest ropes
                let first = arr.shift();
                let second = arr.shift();

                // Connect them
                let sum = first + second;

                // Add cost
                cost += sum;

                // Put new rope back
                arr.push(sum);
            }

            return cost;
        }

        // Example
        let arr = [4, 3, 2, 6];
        console.log(minCost(arr)); 
    </script>

    <script type="text/javascript" src="./script.js">
</script>

</body>

</html>
